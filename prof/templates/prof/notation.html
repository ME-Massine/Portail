{% extends 'base.html' %}
{% load dict_extras %}

{% block extra_css %}
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --warning: #f8961e;
            --danger: #ef233c;
            --card-radius: 12px;
        }

        .grade-form-container {
            background: white;
            border-radius: var(--card-radius);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-header {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #ced4da;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }

        .btn-submit {
            background-color: var(--primary);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }

        .select-control {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%234361ee' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container py-4">
        <div class="grade-form-container">
            <h2 class="form-header"><i class="fas fa-edit me-2"></i> Ajouter une Note</h2>

            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <!-- Left Column -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="etudiant" class="form-label">Étudiant</label>
                            <select class="form-control select-control" id="etudiant" name="etudiant" required>
                                <option value="" selected disabled>Sélectionner un étudiant</option>
                                <!-- Options will be filled by JS -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="matiere" class="form-label">Matière</label>
                            <select class="form-control select-control" id="matiere" name="matiere" required>
                                <option value="" selected disabled>Sélectionner une matière</option>
                                {% for matiere in matieres %}
                                    <option value="{{ matiere.id }}">{{ matiere.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="type_note" class="form-label">Type de Note</label>
                            <select class="form-control select-control" id="type_note" name="type_note" required>
                                <option value="exam">Examen</option>
                                <option value="controle">Contrôle</option>
                                <option value="discipline">Discipline</option>
                            </select>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="valeur" class="form-label">Note (/20)</label>
                            <input type="number" min="0" max="20" step="0.25"
                                   class="form-control" id="valeur" name="valeur"
                                   placeholder="00.00" required>
                            <small class="text-muted">Doit être entre 0 et 20</small>
                        </div>

                        <div class="form-group">
                            <label for="date_attribution" class="form-label">Date d'attribution</label>
                            <input type="date" class="form-control" id="date_attribution"
                                   name="date_attribution" value="{% now 'Y-m-d' %}" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="commentaire" class="form-label">Commentaire</label>
                    <textarea class="form-control" id="commentaire" name="commentaire"
                              rows="3" placeholder="Observations sur la note..."></textarea>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-save me-2"></i> Enregistrer la Note
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script>
        // Client-side validation
        document.querySelector('form').addEventListener('submit', function (e) {
            const noteValue = parseFloat(document.getElementById('valeur').value);

            if (isNaN(noteValue) || noteValue < 0 || noteValue > 20) {
                e.preventDefault();
                alert('Veuillez entrer une note valide entre 0 et 20');
                document.getElementById('valeur').focus();
            }
        });

        // Dynamic student dropdown based on selected course
        const matiereEtudiants = {{ matiere_etudiants|safe }};
        const matiereSelect = document.getElementById('matiere');
        const etudiantSelect = document.getElementById('etudiant');
        matiereSelect.addEventListener('change', function() {
            const matiereId = this.value;
            etudiantSelect.innerHTML = '<option value="">Sélectionner un étudiant</option>';
            if (matiereEtudiants[matiereId]) {
                matiereEtudiants[matiereId].forEach(function(etudiant) {
                    etudiantSelect.innerHTML += `<option value="${etudiant.id}">${etudiant.name}</option>`;
                });
            }
        });

        // Initialize date picker (optional)
        flatpickr("#date_attribution", {
            dateFormat: "Y-m-d",
            defaultDate: "today"
        });
    </script>
{% endblock %}
