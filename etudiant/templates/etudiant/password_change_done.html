{% extends 'base.html' %}

{% block content %}
    <div class="main-content">
        <div class="password-change-container">
            <div class="password-card">
                <div class="password-header">
                    <h2><i class="fas fa-check-circle text-success"></i> Mot de passe changé</h2>
                    <p>Votre mot de passe a été modifié avec succès.</p>
                </div>
                <a href="{% url 'etudiant:settings' %}" class="btn-submit">
                    <i class="fas fa-arrow-left"></i> Retour au profil
                </a>
            </div>
        </div>
    </div>

    <style>
        .password-change-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .password-card {
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            background: white;
            padding: 2rem;
            text-align: center;
        }

        .password-header {
            margin-bottom: 2rem;
        }

        .password-header h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border-radius: var(--border-radius);
            text-decoration: none;
        }
    </style>
{% endblock %}
