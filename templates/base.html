{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4361ee">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portail Admin</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-light: #4cc9f0;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #ef233c;
            --light-color: #f8f9fa;
            --dark-color: #2c3e50;
            --border-radius: 10px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --glass-blur: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f7ff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            transition: all 0.3s ease;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: #121212;
            color: #f8f9fa;
        }

        main {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
            transition: margin-left 0.3s ease;
            width: calc(100% - 280px);
            min-height: 100vh;
            background-color: #f5f7ff;
        }

        body.dark-mode main {
            background-color: #121212;
        }

        .main-content {
            max-width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
                padding: 1rem;
            }
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--box-shadow);
            transition: all 0.3s ease;
        }

        body.dark-mode .glass-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Gradient Cards */
        .gradient-card-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(67, 97, 238, 0.3);
            border: none;
        }

        .gradient-card-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(67, 97, 238, 0.4);
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(67, 97, 238, 0.3);
            z-index: 1000;
            transition: all 0.3s ease;
            border: none;
        }

        .fab:hover {
            transform: scale(1.1);
            background: var(--secondary-color);
        }

        /* Custom Table */
        .table-admin {
            --bs-table-bg: transparent;
            --bs-table-striped-bg: rgba(67, 97, 238, 0.05);
            --bs-table-hover-bg: rgba(67, 97, 238, 0.1);
            margin-bottom: 0;
        }

        body.dark-mode .table-admin {
            --bs-table-striped-bg: rgba(67, 97, 238, 0.1);
            --bs-table-hover-bg: rgba(67, 97, 238, 0.2);
            color: #f8f9fa;
        }

        .table-admin th {
            border-bottom: 2px solid var(--primary-color);
            background-color: rgba(67, 97, 238, 0.1);
            font-weight: 600;
        }

        body.dark-mode .table-admin th {
            background-color: rgba(67, 97, 238, 0.2);
        }

        /* Text Gradient */
        .text-gradient {
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Custom Buttons */
        .btn-rounded {
            border-radius: 50px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
{% block nav %}
    {% include 'sidebar.html' %}
{% endblock %}

<main class="{% block main_class %}with-sidebar{% endblock %}">
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
